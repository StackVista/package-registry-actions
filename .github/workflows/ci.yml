name: CI
run-name: "CI: ${{ github.event_name == 'pull_request' && format('{0} #{1}', github.head_ref, github.event.pull_request.number) || github.ref_name }} [${{ github.event_name }}]"

# This repo holds composite actions only, so CI is a zizmor audit of the actions
# themselves. Their runtime behaviour is proven by the publisher workflows that call them.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b572f7b1a1c2d41efaab43d504f68d215c3cd727 # v0.5.4
        with:
          advanced-security: false

  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs:
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate workflow results
        env:
          NEEDS_RESULT: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$NEEDS_RESULT"
          if [[ "$NEEDS_RESULT" =~ failure|cancelled ]]; then
            exit 1
          fi
