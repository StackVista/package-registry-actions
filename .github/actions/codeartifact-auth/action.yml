name: CodeArtifact auth
description: >-
  Fetch a CodeArtifact authorization token and write it to a 0600 credentials file for
  sbt/Ivy/Coursier, exporting only the containing directory path. Assumes the caller has
  already configured AWS credentials.

inputs:
  domain:
    description: CodeArtifact domain name.
    required: true
  domain-owner:
    description: AWS account ID owning the CodeArtifact domain.
    required: true
  region:
    description: AWS region the domain lives in.
    required: true
  repository:
    description: >-
      The single CodeArtifact repository this job may publish to (`packages` or
      `packages-snapshot`). A credential is written for this repository only.
    required: true

runs:
  using: composite
  steps:
    - name: Write CodeArtifact publish credentials
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        CODEARTIFACT_DOMAIN: ${{ inputs.domain }}
        CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.domain-owner }}
        CODEARTIFACT_REGION: ${{ inputs.region }}
        CODEARTIFACT_REPOSITORY: ${{ inputs.repository }}
      run: |
        # Ivy matches credentials on the realm and host from CodeArtifact's 401 challenge, which is
        # `Basic realm="<domain>/<repository>"` at the bare hostname. Neither may carry the /maven/
        # path, and the realm is unrelated to the resolver name in publishTo.
        credentials_host="${CODEARTIFACT_DOMAIN}-${CODEARTIFACT_DOMAIN_OWNER}.d.codeartifact.${CODEARTIFACT_REGION}.amazonaws.com"

        auth_token="$(aws codeartifact get-authorization-token \
          --domain "${CODEARTIFACT_DOMAIN}" \
          --domain-owner "${CODEARTIFACT_DOMAIN_OWNER}" \
          --region "${CODEARTIFACT_REGION}" \
          --query authorizationToken --output text)"
        echo "::add-mask::${auth_token}"

        # The token is domain-scoped, so it authenticates both repositories. Write a credential for
        # only the one this ref may publish to: Ivy sends credentials per matched realm, so a
        # snapshot build that carries no `<domain>/packages` realm entry cannot answer a challenge
        # from the release repository at all. The build reads whichever files exist.
        credentials_file="${RUNNER_TEMP}/codeartifact-${CODEARTIFACT_REPOSITORY}.credentials"
        install -m 600 /dev/null "${credentials_file}"
        printf '%s\n' \
          "realm=${CODEARTIFACT_DOMAIN}/${CODEARTIFACT_REPOSITORY}" \
          "host=${credentials_host}" \
          'user=aws' \
          "password=${auth_token}" \
          > "${credentials_file}"

        echo "CODEARTIFACT_CREDENTIALS_DIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
